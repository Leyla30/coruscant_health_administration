{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h2>Dashboard</h2>

<p>
    Welcome, {{ current_user.username }}
</p>

<p>
    Role: {{ current_user.role }}
</p>

{% if current_user.approved %}
    <p>Account approved</p>
{% else %}
    <p>Waiting for administrator approval</p>
{% endif %}

{% endblock %}
